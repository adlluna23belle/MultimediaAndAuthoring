<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Rendering — Ira L. Barasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #0a0a0a; --dark: #111111; --card: #181818;
      --border: #2a2a2a; --muted: #3d3d3d; --mid: #888888;
      --light: #c8c8c8; --white: #f0f0f0;
      --accent: #d4af6a; --accent-dim: #a07c3a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Syne', sans-serif; background: var(--black); color: var(--white); }

    nav {
      background: var(--dark); border-bottom: 1px solid var(--border);
      padding: 0 2.5rem; display: flex; align-items: center;
      justify-content: space-between; height: 62px; position: sticky; top: 0; z-index: 100;
    }
    .nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; color: var(--white); text-decoration: none; }
    .nav-links { display: flex; gap: 0.3rem; }
    .nav-links a {
      color: var(--mid); text-decoration: none; font-size: 0.8rem;
      padding: 0.4rem 1rem; text-transform: uppercase;
    }

    .hero {
      padding: 5rem 2.5rem 4rem; border-bottom: 1px solid var(--border);
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 6vw, 5rem);
    }

    .content { max-width: 1060px; margin: 0 auto; padding: 5rem 2.5rem; }

    .video-wrap {
      border: 1px solid var(--border);
      aspect-ratio: 16/9;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">Ira L. Barasi</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
  </div>
</nav>

<div class="hero">
  <h1>3D Rendering<br/>Solar System</h1>
</div>

      src="https://www.youtube.com/embed/oFCZUbQIL_g"
      title="3D Solar System — Final Render"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>

  </div>

  <p>
    Watch on 
    <a href="https://youtu.be/oFCZUbQIL_g" target="_blank">YouTube</a>

</div>

<footer>

</footer>

</body>
</html>
